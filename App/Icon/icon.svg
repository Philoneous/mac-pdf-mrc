<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3478F6"/><stop offset="1" stop-color="#1A3C9E"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBD38D"/><stop offset="1" stop-color="#F09A6C"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0A1A4A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- unten: Hintergrund (Papierton/Farbverlauf) -->
  <g transform="translate(512 730) skewX(-18) scale(0.86 0.42)" filter="url(#sh)">
    <rect x="-230" y="-260" width="460" height="520" rx="30" fill="url(#paper)"/>
  </g>
  <!-- Mitte: Farbebene mit Logo und Stempel -->
  <g transform="translate(512 550) skewX(-18) scale(0.86 0.42)" filter="url(#sh)">
    <rect x="-230" y="-260" width="460" height="520" rx="30" fill="#FFFFFF" fill-opacity="0.35" stroke="#FFFFFF" stroke-width="10"/>
    <circle cx="-100" cy="120" r="100" fill="#22C55E"/>
    <rect x="-142" y="78" width="84" height="84" rx="12" fill="#FFFFFF"/>
    <rect x="40" y="90" width="160" height="110" rx="22" fill="#EF4444"/>
  </g>
  <!-- oben: Textmaske (nur schwarze Schrift, scharf) -->
  <g transform="translate(512 365) skewX(-18) scale(0.86 0.42)" filter="url(#sh)">
    <rect x="-230" y="-260" width="460" height="520" rx="30" fill="#FFFFFF"/>
    <g fill="#111827">
      <rect x="-175" y="-190" width="230" height="56" rx="28"/>
      <rect x="-175" y="-90" width="350" height="44" rx="22"/>
      <rect x="-175" y="-10" width="320" height="44" rx="22"/>
      <rect x="-175" y="70" width="350" height="44" rx="22"/>
      <rect x="-175" y="150" width="200" height="44" rx="22"/>
    </g>
  </g>
</svg>
