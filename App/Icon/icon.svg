<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3478F6"/><stop offset="1" stop-color="#1A3C9E"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1D6"/><stop offset="1" stop-color="#FBC9A2"/>
    </linearGradient>
    <!-- Liquid Glass: spiegelnder Rand (oben links und unten rechts hell), Glanz oben -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <!-- Milchglas: Dahinterliegendes unscharf und etwas farbkräftiger -->
    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="16"/>
      <feColorMatrix type="saturate" values="1.2"/>
    </filter>
    <filter id="shadowOnly" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
      <feOffset in="b" dx="-6" dy="16" result="o"/>
      <feFlood flood-color="#0A1A4A" flood-opacity="0.38"/>
      <feComposite operator="in" in2="o"/>
    </filter>

    <clipPath id="clipColor"><rect x="379" y="275" width="303.6" height="428.7" rx="20"/></clipPath>
    <clipPath id="clipText"><rect x="244" y="330" width="330" height="466" rx="22"/></clipPath>

    <!-- Ebenen (werden unten gezeichnet und als Hintergrund der Glasebenen wiederverwendet) -->
    <g id="base">
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
      <!-- hinten rechts: Hintergrund (Papierton) -->
      <rect x="500" y="228" width="280.5" height="396" rx="19" fill="#0A1A4A" filter="url(#shadowOnly)"/>
      <rect x="500" y="228" width="280.5" height="396" rx="19" fill="url(#paper)"/>
    </g>

    <!-- Mitte: Farbebene (Glas) mit Logo -->
    <g id="color">
      <rect x="379" y="275" width="303.6" height="428.7" rx="20" fill="#000" filter="url(#shadowOnly)"/>
      <g clip-path="url(#clipColor)"><use xlink:href="#base" filter="url(#frost)"/></g>
      <rect x="379" y="275" width="303.6" height="428.7" rx="20" fill="url(#sheen)"/>
      <rect x="379" y="275" width="303.6" height="428.7" rx="20" fill="#FFFFFF" fill-opacity="0.18"/>
      <rect x="381" y="277" width="299.6" height="424.7" rx="18" fill="none" stroke="url(#rim)" stroke-width="5"/>
      <!-- Logo: weißes Blatt im grünen Kreis -->
      <circle cx="627.4" cy="341.2" r="42.3" fill="#16A34A"/>
      <g transform="translate(627.4 341.2) scale(0.846)">
        <path d="M -26 26 C -30 -14 -2 -34 34 -34 C 34 4 12 30 -26 26 Z" fill="#FFFFFF"/>
        <path d="M -26 26 L 18 -18" stroke="#16A34A" stroke-width="5" stroke-linecap="round"/>
        <path d="M -26 26 L -34 34" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      </g>
    </g>
  </defs>

  <use xlink:href="#base"/>
  <use xlink:href="#color"/>

  <!-- vorne links: Textebene (Glas, nur die Schrift deckend) -->
  <rect x="244" y="330" width="330" height="466" rx="22" fill="#000" filter="url(#shadowOnly)"/>
  <g clip-path="url(#clipText)">
    <use xlink:href="#base" filter="url(#frost)"/>
    <use xlink:href="#color" filter="url(#frost)"/>
  </g>
  <rect x="244" y="330" width="330" height="466" rx="22" fill="url(#sheen)"/>
  <rect x="244" y="330" width="330" height="466" rx="22" fill="#FFFFFF" fill-opacity="0.3"/>
  <rect x="246" y="332" width="326" height="462" rx="20" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <g transform="translate(244 330)" fill="#0B1220">
    <!-- Absender links neben dem Logo -->
    <rect x="30" y="36" width="150" height="14" rx="7"/>
    <rect x="30" y="60" width="110" height="10" rx="5"/>
    <rect x="30" y="78" width="125" height="10" rx="5"/>
    <!-- Anschrift -->
    <rect x="30" y="122" width="120" height="11" rx="5.5"/>
    <rect x="30" y="141" width="140" height="11" rx="5.5"/>
    <rect x="30" y="160" width="100" height="11" rx="5.5"/>
    <!-- Betreff -->
    <rect x="30" y="204" width="200" height="15" rx="7.5"/>
    <!-- Text über die ganze Breite -->
    <rect x="30" y="240" width="270" height="11" rx="5.5"/>
    <rect x="30" y="261" width="262" height="11" rx="5.5"/>
    <rect x="30" y="282" width="270" height="11" rx="5.5"/>
    <rect x="30" y="303" width="180" height="11" rx="5.5"/>
    <rect x="30" y="335" width="270" height="11" rx="5.5"/>
    <rect x="30" y="356" width="245" height="11" rx="5.5"/>
    <!-- Gruß -->
    <rect x="30" y="400" width="110" height="11" rx="5.5"/>
  </g>
</svg>
