name: macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: "Release veröffentlichen? Die nächste Nummer wird aus dem letzten Tag berechnet (steht in der Zusammenfassung jedes Laufs)"
        type: choice
        options:
          - nur Tests
          - Patch (Fehlerbehebung, x.y.Z)
          - Minor (neue Funktionen, x.Y.0)
          - Major (große Änderung, X.0.0)
        default: nur Tests
      version:
        description: "Oder eine bestimmte Version, z. B. 1.2.0 (hat Vorrang)"
        required: false
        default: ""

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  app:
    name: App (DMG)
    runs-on: macos-15
    permissions:
      contents: write  # Branch ci-screenshots und Releases
    timeout-minutes: 60
    env:
      MRC_APP: /Applications/PDF MRC.app
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Build-Nummer = Anzahl Commits

      # Nächste Versionsnummern aus dem letzten Tag v* – als Vorschlag in der Zusammenfassung jedes Laufs
      - name: Nächste Version berechnen
        id: next
        env:
          RELEASE: ${{ inputs.release }}
          VERSION: ${{ inputs.version }}
        run: |
          last="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          IFS=. read -r ma mi pa <<<"${last:-0.0.0}"
          patch="$ma.$mi.$((pa + 1))"; minor="$ma.$((mi + 1)).0"; major="$((ma + 1)).0.0"
          echo "### Nächste Version (letzte: ${last:-keine})" >> "$GITHUB_STEP_SUMMARY"
          echo "Patch **$patch** · Minor **$minor** · Major **$major**" >> "$GITHUB_STEP_SUMMARY"
          case "$RELEASE" in
            Patch*) chosen="$patch" ;;
            Minor*) chosen="$minor" ;;
            Major*) chosen="$major" ;;
            *) chosen="" ;;
          esac
          [[ -z "$VERSION" ]] || chosen="$VERSION"
          echo "version=$chosen" >> "$GITHUB_OUTPUT"
          [[ -z "$chosen" ]] || echo "Wird veröffentlicht: **v$chosen**" >> "$GITHUB_STEP_SUMMARY"

      # Release per Knopf (Actions → macOS → Run workflow, Patch/Minor/Major wählen): Tag nur lokal setzen, damit Build
      # und release.sh die Version kennen; auf GitHub legt „gh release create --target“ das Tag beim Veröffentlichen an.
      - name: Release vorbereiten
        if: github.event_name == 'workflow_dispatch' && steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Releases nur von main"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version „${VERSION}“ ungültig (z. B. 1.0.0)"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || { echo "::error::Tag v${VERSION} gibt es schon"; exit 1; }
          git tag "v$VERSION"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Übersetzungen prüfen
        run: python3 ci/check_strings.py

      # Release-Notizen kommen aus CHANGELOG.md (nur Englisch); bei einem Release muss „Unreleased“ Einträge haben
      - name: Changelog prüfen
        run: |
          if [[ -n "${RELEASE_TAG:-}" || "$GITHUB_REF" == refs/tags/v* ]]; then python3 ci/check_changelog.py --notes
          else python3 ci/check_changelog.py; fi

      - name: Swift prüfen (schnell)
        run: xcrun swiftc -swift-version 5 -parse-as-library -target arm64-apple-macos13.0 -typecheck App/Sources/*.swift

      - name: App bauen
        timeout-minutes: 30
        run: /bin/bash ci/report.sh Bauen /bin/bash build/build_app.sh dist --standalone

      - name: DMG
        run: /bin/bash ci/report.sh DMG /bin/bash build/make_dmg.sh dist dist/PDF-MRC.dmg

      - name: Aus dem DMG installieren, Homebrew ausblenden
        run: |
          hdiutil attach -quiet -nobrowse -mountpoint /tmp/pdfmrc dist/PDF-MRC.dmg
          ditto "/tmp/pdfmrc/PDF MRC.app" "$MRC_APP"
          hdiutil detach -quiet /tmp/pdfmrc
          sudo mv /opt/homebrew /opt/homebrew-ausgeblendet
          "$MRC_APP/Contents/MacOS/pdf-mrc" --schnellaktionen-einrichten

      - name: Kontextmenü-Modus
        run: /bin/bash ci/report.sh Kontextmenü "$MRC_APP/Contents/Resources/python/bin/python3" -B ci/test_app.py "$RUNNER_TEMP/pdfs"

      - name: Paperless senden
        run: /bin/bash ci/report.sh Paperless "$MRC_APP/Contents/Resources/python/bin/python3" -B ci/test_paperless.py "$RUNNER_TEMP/paperless"

      - name: Oberfläche
        run: /bin/bash ci/report.sh Oberfläche /bin/bash ci/screenshots.sh

      - name: Update über Sparkle
        run: /bin/bash ci/report.sh Update /bin/bash ci/test_update.sh

      - name: Homebrew wieder einblenden
        if: always()
        run: if [ -d /opt/homebrew-ausgeblendet ]; then sudo mv /opt/homebrew-ausgeblendet /opt/homebrew; fi

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: /bin/bash ci/report.sh Release /bin/bash build/release.sh

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: app
          path: |
            dist/PDF-MRC.dmg
            shots/
          if-no-files-found: ignore

      # Nur bei manuellem Start: Bildschirmfotos zusätzlich in den Branch ci-screenshots (per Git abrufbar)
      - name: Bildschirmfotos in Branch ci-screenshots
        if: always() && github.event_name == 'workflow_dispatch' && steps.next.outputs.version == ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b ci-screenshots
          git add ./*.png
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Bildschirmfotos $GITHUB_SHA"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" ci-screenshots

  homebrew:
    name: Homebrew-Installer (Backup)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer
        run: SRC_DIR="$GITHUB_WORKSPACE" /bin/bash ci/report.sh Installer /bin/bash install.sh

      - name: Kontextmenü-Modus
        run: /bin/bash ci/report.sh Kontextmenü "$(uv tool dir)/paperless-mrc/bin/python" ci/test_app.py "$RUNNER_TEMP/pdfs"

      - name: Paperless senden
        run: /bin/bash ci/report.sh Paperless "$(uv tool dir)/paperless-mrc/bin/python" ci/test_paperless.py "$RUNNER_TEMP/paperless"
